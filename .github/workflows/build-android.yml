
name: Build OffGrid Comms Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & BLE Mesh dependencies
        run: npm install

      - name: Generate native Android project
        run: npx cap add android

      - name: Inject Android 12+ Bluetooth Mesh permissions
        run: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              xml = f.read()
          perms = """
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
          """
          xml = xml.replace("<application", perms + "\n    <application", 1)
          with open(path, "w") as f:
              f.write(xml)
          '

      - name: Sync web assets & BLE plugin
        run: npx cap sync android

      - name: Compile Debug APK and Store AAB Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload OffGrid Comms APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: OffGrid-Comms-Android-Builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
